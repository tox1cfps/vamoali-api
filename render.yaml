databases:
  - name: vamoali
    databaseName: vamoali
    user: vamoali
    ipAllowList: []

services:
  - type: web
    name: vamoali-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: gunicorn --bind 0.0.0.0:$PORT --access-logfile=- app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: vamoali
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_PAYLOAD_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_JOB_SECRET
        generateValue: true
      - key: ENABLE_PASSWORD_RESET
        value: "true"
      - key: PASSWORD_RESET_URL
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: VamoAli
      - key: BACKUP_EMAIL
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: SHEET_NAME
        sync: false
      - key: REPORT_SHEET_NAME
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
