
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      SHEET_NAME: ci-sheet
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      FERNET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      GOOGLE_CREDENTIALS_JSON: '{"type":"service_account"}'
      ENABLE_PASSWORD_RESET: "false"
      DATABASE_URL: sqlite:///ci-vamoali.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt
          pip install pip-audit

      - name: Check Black
        run: black --check .

      - name: Check isort
        run: isort --check-only .

      - name: Check Ruff
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Security audit
        shell: bash
        run: |
          set +e
          pip-audit -r requirements.txt --format=json > audit.json
          AUDIT_EXIT_CODE=$?
          set -e

          export AUDIT_EXIT_CODE

          python - <<'PY'
          import json
          import os
          import sys

          try:
              with open("audit.json", encoding="utf-8") as file:
                  report = json.load(file)
          except (OSError, json.JSONDecodeError) as error:
              print(f"Erro ao ler relatório do pip-audit: {error}")
              sys.exit(1)

          dependencies = report.get("dependencies")

          if not isinstance(dependencies, list):
              print("Formato inesperado do relatório do pip-audit.")
              sys.exit(1)

          ignored_package = "cryptography"
          failures = []
          ignored_vulnerabilities = []

          for dependency in dependencies:
              name = dependency.get("name", "").lower()
              version = dependency.get("version", "unknown")

              for vulnerability in dependency.get("vulns", []):
                  vulnerability_id = vulnerability.get("id", "ID desconhecido")

                  if name == ignored_package:
                      ignored_vulnerabilities.append(
                          f"{name} {version}: {vulnerability_id}"
                      )
                  else:
                      failures.append(
                          f"{name} {version}: {vulnerability_id}"
                      )

          print("\nVulnerabilidades temporariamente ignoradas:")

          if ignored_vulnerabilities:
              for item in ignored_vulnerabilities:
                  print(f"  - {item}")
          else:
              print("  Nenhuma encontrada.")

          if failures:
              print("\nVulnerabilidades que bloqueiam o CI:")

              for item in failures:
                  print(f"  - {item}")

              sys.exit(1)

          audit_exit_code = int(os.environ.get("AUDIT_EXIT_CODE", "0"))

          if audit_exit_code != 0 and not ignored_vulnerabilities:
              print("\nO pip-audit terminou com erro não relacionado à exceção.")
              sys.exit(1)

          print("\nAuditoria concluída.")
          print("Nenhuma vulnerabilidade fora da exceção temporária.")
          PY

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: audit.json
          if-no-files-found: ignore
          retention-days: 30

  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
