name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger provider deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing GitHub Actions secret RENDER_DEPLOY_HOOK_URL. Add the Render deploy hook URL under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
