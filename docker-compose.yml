services:
  api:
    build: .
    command: sh -c "alembic upgrade head && gunicorn --bind 0.0.0.0:$${PORT:-5000} --access-logfile=- app:app"
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://vamoali:vamoali@postgres:5432/vamoali
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-32chars}
      EMAIL_PAYLOAD_ENCRYPTION_KEY: ${EMAIL_PAYLOAD_ENCRYPTION_KEY:-1y4jkErQbu8YqK26jHL14p7zSiu-CJkOFJoLdh_hfrU=}
      ENABLE_PASSWORD_RESET: ${ENABLE_PASSWORD_RESET:-false}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5000/auth.html}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vamoali
      POSTGRES_USER: vamoali
      POSTGRES_PASSWORD: vamoali
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vamoali -d vamoali"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
