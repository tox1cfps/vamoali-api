<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VamoAli 🍽️ - Login</title>
  <link rel="icon" type="image/svg+xml" href="plate-svgrepo-com.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <main id="authPage" class="page auth-page active">
    <section class="auth-shell">
      <aside class="auth-hero" aria-hidden="true">
        <div class="auth-hero__brand">
          <img class="brand-logo" src="restaurant-plate-svgrepo-com.svg" alt="VamoAli">
          <span>VamoAli</span>
        </div>
        <p class="auth-hero__tagline">Seus próximos lugares favoritos, a dois.</p>

        <div class="emoji-grid">
          <div class="emoji-grid__item emoji-grid__item--1">🍕</div>
          <div class="emoji-grid__item emoji-grid__item--2">🍣</div>
          <div class="emoji-grid__item emoji-grid__item--3">🍷</div>
          <div class="emoji-grid__item emoji-grid__item--4">🍜</div>
        </div>
      </aside>

      <section class="auth-panel">
        <div class="auth-panel__inner">
          <div class="auth-brand-mobile">
            <img class="brand-logo" src="restaurant-plate-svgrepo-com.svg" alt="VamoAli">
            <span>VamoAli</span>
          </div>

          <div class="auth-tabs" role="tablist" aria-label="Autenticação">
            <button type="button" class="auth-tab active" data-tab="login" onclick="switchTab('login')">Login</button>
            <button type="button" class="auth-tab" data-tab="register" onclick="switchTab('register')">Cadastro</button>
          </div>

          <form id="loginForm" class="auth-form active" action="javascript:void(0);" novalidate>
            <div class="field-group">
              <label class="field-label" for="loginEmail">Email</label>
              <input class="field-input" type="email" id="loginEmail" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
              <span class="field-error" id="loginEmailError"></span>
            </div>

            <div class="field-group">
              <label class="field-label" for="loginPassword">Senha</label>
              <input class="field-input" type="password" id="loginPassword" name="password" placeholder="Sua senha" autocomplete="current-password" required>
              <span class="field-error" id="loginPasswordError"></span>
            </div>

            <div class="form-error" id="loginFormError" aria-live="polite">
              <img src="warning-1-svgrepo-com.svg" alt="" class="form-error__icon" style="width:20px;height:20px;">
              <span class="form-error__text"></span>
            </div>

            <button type="submit" class="primary-button">
              <span>Entrar</span>
              <span class="primary-button__arrow">→</span>
            </button>

            <button type="button" class="auth-link-button" onclick="openModal('resetPasswordRequestModal')">Esqueci minha senha</button>
          </form>

          <form id="registerForm" class="auth-form" action="javascript:void(0);" novalidate>
            <div class="field-group">
              <label class="field-label" for="registerUsername">Nome de usuário</label>
              <input class="field-input" type="text" id="registerUsername" name="username" placeholder="Seu nome" autocomplete="username" required>
              <span class="field-error" id="registerUsernameError"></span>
            </div>

            <div class="field-group">
              <label class="field-label" for="registerEmail">Email</label>
              <input class="field-input" type="email" id="registerEmail" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
              <span class="field-error" id="registerEmailError"></span>
            </div>

            <div class="field-group">
              <label class="field-label" for="registerPassword">Senha</label>
              <input class="field-input" type="password" id="registerPassword" name="password" placeholder="Crie uma senha" autocomplete="new-password" required>
              <span class="field-error" id="registerPasswordError"></span>
            </div>

            <div class="form-error" id="registerFormError" aria-live="polite">
              <img src="warning-1-svgrepo-com.svg" alt="" class="form-error__icon" style="width:20px;height:20px;">
              <span class="form-error__text"></span>
            </div>

            <button type="submit" class="primary-button">
              <span>Cadastrar</span>
              <span class="primary-button__arrow">→</span>
            </button>
          </form>
        </div>
      </section>
    </section>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <div id="resetPasswordRequestModal" class="modal" onclick="if(event.target===this) closeModal('resetPasswordRequestModal')">
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="resetRequestTitle">
      <div class="modal__header">
        <img src="warning-1-svgrepo-com.svg" alt="" style="width:32px;height:32px;filter:invert(42%) sepia(75%) saturate(1545%) hue-rotate(330deg) brightness(96%) contrast(89%);">
        <div>
          <h2 id="resetRequestTitle">Esqueci minha senha</h2>
          <p>Digite seu email para receber o desafio matemático.</p>
        </div>
        <button type="button" class="modal__close" onclick="closeModal('resetPasswordRequestModal')" aria-label="Fechar">✕</button>
      </div>

      <form id="resetPasswordRequestForm" class="modal-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="resetEmail">Email</label>
          <input class="field-input" type="email" id="resetEmail" placeholder="voce@exemplo.com" required>
          <span class="field-error" id="resetEmailError"></span>
        </div>

        <div class="form-error" id="resetRequestFormError" aria-live="polite">
          <span class="form-error__icon">⚠️</span>
          <span class="form-error__text"></span>
        </div>

        <div class="modal-actions">
          <button type="button" class="secondary-button" onclick="closeModal('resetPasswordRequestModal')">Cancelar</button>
          <button type="submit" class="primary-button">Gerar desafio</button>
        </div>
      </form>
    </div>
  </div>

  <div id="resetPasswordConfirmModal" class="modal" onclick="if(event.target===this) closeModal('resetPasswordConfirmModal')">
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="resetConfirmTitle">
      <div class="modal__header">
        <div class="modal__emoji">🧠</div>
        <div>
          <h2 id="resetConfirmTitle">Desafio de segurança</h2>
          <p id="resetQuestionText">Responda corretamente para continuar.</p>
        </div>
        <button type="button" class="modal__close" onclick="closeModal('resetPasswordConfirmModal')" aria-label="Fechar">✕</button>
      </div>

      <form id="resetPasswordConfirmForm" class="modal-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="resetAnswer">Resposta</label>
          <input class="field-input" type="text" id="resetAnswer" placeholder="Sua resposta" required>
          <span class="field-error" id="resetAnswerError"></span>
        </div>

        <div class="field-group">
          <label class="field-label" for="resetNewPassword">Nova senha</label>
          <input class="field-input" type="password" id="resetNewPassword" placeholder="Crie uma nova senha" required>
          <span class="field-error" id="resetNewPasswordError"></span>
        </div>

        <div class="form-error" id="resetConfirmFormError" aria-live="polite">
          <span class="form-error__icon">⚠️</span>
          <span class="form-error__text"></span>
        </div>

        <div class="modal-actions">
          <button type="button" class="secondary-button" onclick="closeModal('resetPasswordConfirmModal')">Cancelar</button>
          <button type="submit" class="primary-button">Redefinir</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js?v=11"></script>
</body>
</html>
