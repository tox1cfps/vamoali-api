<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VamoAli 🍽️</title>
  <link rel="icon" type="image/svg+xml" href="plate-svgrepo-com.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <main id="placesPage" class="page places-page active">
    <nav class="navbar">
      <div class="navbar__inner">
        <div class="navbar__brand">
          <img class="brand-logo" src="restaurant-plate-svgrepo-com.svg" alt="VamoAli">
          <span>VamoAli</span>
        </div>
        <div class="navbar__search">
          <img class="navbar__search-icon icon-tint-dark" src="magnifying-glass-9-svgrepo-com.svg" alt="">
          <input type="text" class="navbar__search-input" id="navbarSearch" placeholder="Buscar por nome ou categoria..." autocomplete="off">
        </div>
        <div class="navbar__user">
          <div class="navbar__avatar" id="navbarAvatar" onclick="toggleMobileDropdown()">V</div>
          <span class="navbar__username" id="navbarUserText"></span>
          <div class="navbar__dropdown" id="navbarDropdown">
            <div class="navbar__dropdown-user" id="dropdownUserName"></div>
            <button type="button" class="navbar__dropdown-logout" onclick="logout()">Sair</button>
          </div>
          <button type="button" class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
            <span class="theme-toggle__track">
              <span class="theme-toggle__circle">
                <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="5"></circle>
                  <line x1="12" y1="1" x2="12" y2="3"></line>
                  <line x1="12" y1="21" x2="12" y2="23"></line>
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                  <line x1="1" y1="12" x2="3" y2="12"></line>
                  <line x1="21" y1="12" x2="23" y2="12"></line>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
              </span>
            </span>
          </button>
          <button type="button" class="logout-button" onclick="logout()">Sair</button>
        </div>
      </div>
    </nav>

    <section class="places-shell">
      <header class="places-header">
        <h1>Nossos lugares 🍽️</h1>
      </header>

      <div class="places-tabs" id="placesTabs">
        <button class="places-tab places-tab--active" data-filter="all" onclick="setFilter('all')">Todos</button>
        <button class="places-tab" data-filter="pending" onclick="setFilter('pending')">Para visitar</button>
        <button class="places-tab" data-filter="visited" onclick="setFilter('visited')">Já visitamos</button>
      </div>

      <div id="placesGrid" class="places-grid" aria-live="polite">
        <section id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-state__card">
            <div class="empty-state__icon" aria-hidden="true">📍</div>
            <h2>Nenhum lugar ainda 💕</h2>
            <p>Adicionem o primeiro lugar que vocês querem visitar juntos!</p>
            <button type="button" class="primary-button primary-button--compact" onclick="openAddPlaceModal()">Adicionar primeiro lugar ✨</button>
          </div>
        </section>
      </div>
    </section>

    <div class="fab-shell">
      <button type="button" class="fab" onclick="openAddPlaceModal()" aria-label="Adicionar lugar">+</button>
      <span class="fab-label">Adicionar lugar</span>
    </div>
  </main>

  <div id="addPlaceModal" class="modal" onclick="if(event.target===this) closeModal('addPlaceModal')">
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="addPlaceTitle">
      <div class="modal__header">
        <div class="modal__emoji">🗺️</div>
        <div>
          <h2 id="addPlaceTitle">Adicionar lugar</h2>
          <p>Salve um novo destino para o casal.</p>
        </div>
        <button type="button" class="modal__close" onclick="closeModal('addPlaceModal')" aria-label="Fechar">✕</button>
      </div>

      <form id="addPlaceForm" class="modal-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="placeName">Nome do lugar</label>
          <input class="field-input" type="text" id="placeName" name="name" placeholder="Ex.: Bistrô do Centro" required>
          <span class="field-error" id="addPlaceNameError"></span>
        </div>

        <div class="field-group">
          <label class="field-label" for="placeMapsUrl">Link do Google Maps</label>
          <input class="field-input" type="url" id="placeMapsUrl" name="maps_url" placeholder="https://maps.google.com/..." required>
          <span class="field-error" id="addPlaceMapsError"></span>
        </div>

        <div class="field-group">
          <label class="field-label" for="placeCategory">Categoria <span style="font-weight:400;color:#8b867b;">(opcional)</span></label>
          <select class="field-input" id="placeCategory" name="category">
            <option value="">Selecione uma categoria</option>
            <option value="Restaurante">🍽️ Restaurante</option>
            <option value="Café">☕ Café</option>
            <option value="Bar">🍺 Bar</option>
            <option value="Lazer">🎭 Lazer</option>
            <option value="Compras">🛍️ Compras</option>
            <option value="Ao ar livre">🌳 Ao ar livre</option>
            <option value="Cinema">🎬 Cinema/Teatro</option>
            <option value="Outro">📍 Outro</option>
          </select>
        </div>

        <div class="field-group">
          <label class="field-label" for="placePhotoUrl">Foto do lugar <span style="font-weight:400;color:#8b867b;">(opcional)</span></label>
          <input class="field-input" type="url" id="placePhotoUrl" name="photo_url" placeholder="https://link-da-foto.com/imagem.jpg">
          <span class="field-error" id="addPlacePhotoError"></span>
        </div>

        <div class="form-error" id="addPlaceFormError" aria-live="polite">
          <span class="form-error__icon">⚠️</span>
          <span class="form-error__text"></span>
        </div>

        <div class="modal-actions">
          <button type="button" class="secondary-button" onclick="closeModal('addPlaceModal')">Cancelar</button>
          <button type="submit" class="primary-button">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="feedbackModal" class="modal" onclick="if(event.target===this) closeModal('feedbackModal')">
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
      <div class="modal__header">
        <div class="modal__emoji">💬</div>
        <div>
          <h2 id="feedbackTitle">Adicionar feedback</h2>
          <p>Registre a opinião de vocês sobre o lugar.</p>
        </div>
        <button type="button" class="modal__close" onclick="closeModal('feedbackModal')" aria-label="Fechar">✕</button>
      </div>

      <form id="feedbackForm" class="modal-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="feedbackText">Feedback</label>
          <textarea class="field-input field-input--textarea" id="feedbackText" name="feedback" placeholder="Conte como foi a experiência" required></textarea>
          <span class="field-error" id="feedbackTextError"></span>
        </div>

        <div class="form-error" id="feedbackFormError" aria-live="polite">
          <span class="form-error__icon">⚠️</span>
          <span class="form-error__text"></span>
        </div>

        <div class="modal-actions">
          <button type="button" class="secondary-button" onclick="closeModal('feedbackModal')">Cancelar</button>
          <button type="submit" class="primary-button">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js?v=10"></script>
</body>
</html>
