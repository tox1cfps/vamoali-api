[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120
skip = [".venv"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    ".venv/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
show_missing = true
